<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="navbar">
    <h2>Asset and Monetary Lending System</h2>
</div>

<div class="container">

        <form method="POST" action="/login">

    </div>

</body>
</html>
